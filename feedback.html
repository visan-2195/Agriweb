<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Agriculture Feedback</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <link rel="stylesheet" href="agri.css" />
</head>
<body>

  <h1>Agri</h1>

  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="ag.html">🌱 Agri</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo03" aria-controls="navbarTogglerDemo03" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="ag.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="service.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="gov.html">Government Services</a></li>
          <li class="nav-item"><a class="nav-link" href="feedback.html">Feedback</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <form class="d-flex ms-auto" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-4">Farmer Feedback Form</h2>
    <form>
      <div class="mb-3">
        <label for="name" class="form-label">Name:</label>
        <input type="text" class="form-control" id="name" name="name" required />
      </div>

      <div class="mb-3">
        <label for="age" class="form-label">Age:</label>
        <input type="number" class="form-control" id="age" name="age" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Gender:</label><br />
        <div class="form-check form-check-inline">
          <input type="radio" class="form-check-input" name="gender" value="male" required />
          <label class="form-check-label">Male</label>
        </div>
        <div class="form-check form-check-inline">
          <input type="radio" class="form-check-input" name="gender" value="female" required />
          <label class="form-check-label">Female</label>
        </div>
        <div class="form-check form-check-inline">
          <input type="radio" class="form-check-input" name="gender" value="other" required />
          <label class="form-check-label">Other</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Are you currently involved in farming?</label>
        <select class="form-select" name="farming" required>
          <option value="">--Select--</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Type of farming you practice:</label>
        <select class="form-select" name="farming_type">
          <option value="">--Select--</option>
          <option value="organic">Organic</option>
          <option value="inorganic">Inorganic</option>
          <option value="mixed">Mixed</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="main_crop" class="form-label">Main crop you cultivate:</label>
        <input type="text" class="form-control" id="main_crop" name="main_crop" />
      </div>

      <div class="mb-3">
        <label class="form-label">Do you use modern farming tools?</label>
        <select class="form-select" name="tools">
          <option value="">--Select--</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Do you face issues with water availability?</label>
        <select class="form-select" name="water_issue">
          <option value="">--Select--</option>
          <option value="always">Always</option>
          <option value="sometimes">Sometimes</option>
          <option value="never">Never</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="feedback" class="form-label">Suggestions/Feedback:</label>
        <textarea class="form-control" id="feedback" name="feedback" rows="4"></textarea>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="email" name="email" required />
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>
      <button type="reset" class="btn btn-secondary">Reset</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.href === window.location.href) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
      }
    });
  </script>
</body>
</html>
